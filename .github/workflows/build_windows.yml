name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FEATURES_TO_TEST: md5,sha1,pkcs1-encrypt-decrypt

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          symcrypt: "https://github.com/microsoft/SymCrypt/releases/download/v103.6.0/symcrypt-windows-amd64-release-103.6.0-1d7e34b.zip"
          run-tests: true
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          symcrypt: "https://github.com/microsoft/SymCrypt/releases/download/v103.6.0/symcrypt-windows-arm64-release-103.6.0-1d7e34b.zip"
          run-tests: false

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: true

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Install target
      shell: pwsh
      run: rustup target add ${{ matrix.target }}

    - name: Download SymCrypt v103.6.0
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "${{ matrix.symcrypt }}" -OutFile symcrypt.zip
        Expand-Archive -Path symcrypt.zip -DestinationPath symcrypt
        "SYMCRYPT_LIB_PATH=$env:GITHUB_WORKSPACE\symcrypt\dll" >> $env:GITHUB_ENV

    - name: Debug build
      run: cargo build --locked --verbose --target ${{ matrix.target }}

    - name: Release build
      run: cargo build --release --locked --verbose --target ${{ matrix.target }}

    - name: Prepare test binaries
      if: matrix.run-tests
      run: |
        cargo test --locked --all-features --no-run --target ${{ matrix.target }}
        cargo test --release --locked --all-features --no-run --target ${{ matrix.target }}

    - name: Stage SymCrypt beside test binaries
      if: matrix.run-tests
      shell: pwsh
      run: |
        $dll = "$env:GITHUB_WORKSPACE\symcrypt\dll\symcrypt.dll"
        Copy-Item $dll "$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\debug\deps\symcrypt.dll"
        Copy-Item $dll "$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release\deps\symcrypt.dll"
        Get-FileHash $dll

    - name: Run tests (Debug)
      if: matrix.run-tests
      run: cargo test --locked --verbose --all-features --target ${{ matrix.target }}

    - name: Run tests (Release)
      if: matrix.run-tests
      run: cargo test --release --locked --verbose --all-features --target ${{ matrix.target }}

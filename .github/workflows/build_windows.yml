name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FEATURES_TO_TEST: md5,sha1,pkcs1-encrypt-decrypt

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          runs-on: windows-latest
          symcrypt: "https://github.com/microsoft/SymCrypt/releases/download/v103.11.0/symcrypt-windows-amd64-release-103.11.0-748c20f1.zip"
          run-tests: true
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          runs-on: windows-latest
          symcrypt: "https://github.com/microsoft/SymCrypt/releases/download/v103.11.0/symcrypt-windows-arm64-release-103.11.0-748c20f1.zip"
          run-tests: false # Windows doesn't support ARM64 emulation
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}    
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}

    steps:
    - uses: actions/checkout@v4 # Checks out SymCrypt based on Github submodule
      with:
        submodules: true

    # - uses: Swatinem/rust-cache@v2  # temporarily disabled to rule out stale cache
    
    # Install host architecture, required for cross-compilation since there is no arm64-windows-msvc runner
    - name: Install host target
      shell: pwsh
      run: |
        rustup target add ${{ matrix.target }}

    - name: Download SymCrypt and Set Environment Variables
      shell: pwsh
      run: |
          Invoke-WebRequest -Uri ${{ matrix.symcrypt }} -OutFile symcrypt.zip
          New-Item -ItemType Directory -Force -Path symcrypt
          Expand-Archive -Path symcrypt.zip -DestinationPath symcrypt
          echo "$env:GITHUB_WORKSPACE\symcrypt\dll" >> $env:GITHUB_PATH
          echo "SYMCRYPT_LIB_PATH=$env:GITHUB_WORKSPACE\symcrypt\dll" >> $env:GITHUB_ENV
          echo "PATH=$env:GITHUB_WORKSPACE\symcrypt\dll;$env:PATH" >> $env:GITHUB_ENV

    - name: Diagnostics
      if: matrix.run-tests
      shell: pwsh
      run: |
          Write-Output "=== Rust ==="
          rustc --version --verbose
          Write-Output "=== OS Version ==="
          [System.Environment]::OSVersion
          Write-Output "=== Downloaded DLL ==="
          $ourDll = "$env:GITHUB_WORKSPACE\symcrypt\dll\symcrypt.dll"
          Get-FileHash $ourDll -Algorithm SHA256
          (Get-Item $ourDll).VersionInfo | Format-List FileVersion,ProductVersion
          Write-Output "=== All symcrypt.dll on system ==="
          Get-ChildItem -Path C:\ -Filter "symcrypt.dll" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { [PSCustomObject]@{
              Path = $_.FullName
              Size = $_.Length
              FileVersion = $_.VersionInfo.FileVersion
              SHA256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }} | Format-Table -AutoSize
          Write-Output "=== DLL search order test ==="
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class DllHelper {
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern IntPtr LoadLibrary(string lpFileName);
              [DllImport("kernel32.dll")]
              public static extern bool FreeLibrary(IntPtr hModule);
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern uint GetModuleFileName(IntPtr hModule, System.Text.StringBuilder lpFilename, uint nSize);
          }
          "@
          $h = [DllHelper]::LoadLibrary("symcrypt.dll")
          if ($h -ne [IntPtr]::Zero) {
              $sb = New-Object System.Text.StringBuilder 260
              [void][DllHelper]::GetModuleFileName($h, $sb, 260)
              Write-Output "Windows loads symcrypt.dll from: $($sb.ToString())"
              [void][DllHelper]::FreeLibrary($h)
          } else {
              Write-Output "Failed to load symcrypt.dll (error: $([System.Runtime.InteropServices.Marshal]::GetLastWin32Error()))"
          }

    - name: Debug build
      run: cargo build --locked --verbose --target ${{ matrix.target }}

    - name: Release build
      run: cargo build --release --locked --verbose --target ${{ matrix.target }}

    # Copy our SymCrypt DLL next to test binaries so it takes priority over any
    # system-installed symcrypt.dll in System32 (DLL search checks the application
    # directory before PATH and System32).
    - name: Stage SymCrypt DLL for tests
      if: matrix.run-tests
      shell: pwsh
      run: |
          $src = "$env:GITHUB_WORKSPACE\symcrypt\dll\symcrypt.dll"
          $targets = @(
            "target\${{ matrix.target }}\debug\deps",
            "target\${{ matrix.target }}\release\deps"
          )
          foreach ($dir in $targets) {
            if (Test-Path $dir) {
              Copy-Item $src $dir -Force
              Write-Output "Copied symcrypt.dll -> $dir"
            }
          }

    - name: Run tests (Debug)
      if: matrix.run-tests
      run: cargo test --locked --verbose --all-features --target ${{ matrix.target }} -- --no-capture

    - name: Run tests (Release)
      if: matrix.run-tests
      run: cargo test --release --locked --verbose --all-features --target ${{ matrix.target }} -- --no-capture

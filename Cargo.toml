[workspace]
members = [
    "rust-symcrypt",
    "symcrypt-bindgen",
    "symcrypt-sys"
]
# `loader_poc/` lives alongside the workspace crates but is intentionally
# excluded so it has zero impact on the main rust-symcrypt build.  Build and
# test it with `cd loader_poc && cargo test`.
exclude = ["loader_poc"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.84.0"

[workspace.dependencies]
libc = "0.2.0"
hex = "0.4.3"
symcrypt-sys = { path = "symcrypt-sys", version = "0.4.0" }

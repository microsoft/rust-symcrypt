[workspace]
members = [
    "rust-symcrypt",
    "symcrypt-bindgen",
    "symcrypt-sys",
    "mscrypto",
    "mscrypto-symcrypt",
    "mscrypto-bcrypt"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.84.0"

[workspace.dependencies]
libc = "0.2.0"
hex = "0.4.3"
symcrypt-sys = { path = "symcrypt-sys", version = "0.4.0" }
